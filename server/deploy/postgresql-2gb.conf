# /etc/postgresql/16/main/conf.d/karvio.conf — PostgreSQL for a 2 GB RAM, 2 CPU, SSD VPS
# shared by many small shop databases.
listen_addresses = 'localhost'
max_connections = 60              # each shop keeps at most 3 open, plus backups and admin
shared_buffers = 384MB
effective_cache_size = 1GB
work_mem = 4MB
maintenance_work_mem = 64MB
wal_buffers = 8MB
min_wal_size = 256MB
max_wal_size = 1GB
checkpoint_completion_target = 0.9
random_page_cost = 1.1            # SSD
effective_io_concurrency = 200
max_worker_processes = 2
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
idle_in_transaction_session_timeout = '5min'
statement_timeout = 0             # restores and backups run long; the app sets its own limits
timezone = 'UTC'
log_min_duration_statement = 2000 # log queries slower than 2 seconds
log_timezone = 'Asia/Dhaka'
