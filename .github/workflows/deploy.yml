name: Deploy Karvio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and check
        working-directory: frontend
        run: |
          npm ci
          npm run check:deploy-build
          touch dist/.nojekyll
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Check browser workflows
        working-directory: frontend
        env:
          KARVIO_BROWSER_CHANNEL: chromium
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: tested-web-build
          path: frontend/dist
          include-hidden-files: true
  deploy-backend:
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: svqhlotlzgmwjneuphpe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require deploy credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is required. Frontend publication is blocked."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Apply tested migrations before Edge deployment
        run: supabase migration up --remote="$SUPABASE_PROJECT_ID" --yes
      - name: Stamp exact backend revision
        run: node scripts/generate-release.cjs "$GITHUB_SHA"
      - name: Deploy karvio-api
        run: supabase functions deploy karvio-api --remote="$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api --yes
      - name: Verify exact backend revision
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS -X POST "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/karvio-api" -H 'Content-Type: application/json' -d '{"action":"ping"}' || true)
            if echo "$body" | grep -q "\"buildId\":\"$GITHUB_SHA\""; then exit 0; fi
            sleep 10
          done
          echo "::error::Expected backend revision not confirmed. Frontend publication is blocked."
          exit 1
  publish-frontend:
    needs: [build-and-test, deploy-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-web-build
          path: dist
      - name: Publish tested frontend after backend verification
        working-directory: dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
