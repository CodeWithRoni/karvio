name: Deploy to staging
# Try a branch on a separate test Supabase project before it reaches the shop.
# One-time setup: create a second (free) Supabase project for testing, then add its project ID as a
# repository variable STAGING_PROJECT_ID (Settings → Secrets and variables → Actions → Variables).
# Run: Actions → Deploy to staging → Run workflow → pick the branch.
# Open the app's setup screen with the staging API link printed at the end to test against it.
# A new staging project has no owner yet: add a repository secret STAGING_SETUP_KEY (24+ letters,
# digits or dashes) and use it as the setup key when creating the staging owner in the app.
# A real shop's data can be tried there by restoring an off-site backup (.karvio.gz) in the app.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging
  cancel-in-progress: false
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STAGING_PROJECT_ID: ${{ vars.STAGING_PROJECT_ID }}
      STAGING_SETUP_KEY: ${{ secrets.STAGING_SETUP_KEY }}
      PRODUCTION_PROJECT_ID: svqhlotlzgmwjneuphpe
    steps:
      - name: Require staging project
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN secret is missing."; exit 1; fi
          if ! echo "$STAGING_PROJECT_ID" | grep -Eq '^[a-z]{20}$'; then echo "::error::Set the repository variable STAGING_PROJECT_ID to the test project's ID (20 lowercase letters)."; exit 1; fi
          if [ "$STAGING_PROJECT_ID" = "$PRODUCTION_PROJECT_ID" ]; then echo "::error::STAGING_PROJECT_ID is the live shop. Use a separate test project."; exit 1; fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run test:supabase
          npm run test:performance
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      - name: Apply migrations to staging
        run: supabase migration up --remote="$STAGING_PROJECT_ID" --yes
      - name: Stamp exact backend revision
        run: node scripts/generate-release.cjs "$GITHUB_SHA"
      - name: Deploy karvio-api to staging
        run: supabase functions deploy karvio-api --remote="$STAGING_PROJECT_ID" --no-verify-jwt --use-api --yes
      - name: Allow owner setup on an empty staging database
        if: env.STAGING_SETUP_KEY != ''
        run: |
          if ! echo "$STAGING_SETUP_KEY" | grep -Eq '^[A-Za-z0-9-]{24,128}$'; then echo "::error::STAGING_SETUP_KEY must be 24-128 letters, digits or dashes."; exit 1; fi
          sql="update karvio_private.runtime set setup_hash = encode(sha256(convert_to('${STAGING_SETUP_KEY}', 'UTF8')), 'hex') where id and not exists (select 1 from public.\"Users\")"
          curl -fsS -X POST "https://api.supabase.com/v1/projects/${STAGING_PROJECT_ID}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" -H 'Content-Type: application/json' \
            --data "$(node -e 'console.log(JSON.stringify({query: process.argv[1]}))' "$sql")" > /dev/null
      - name: Verify staging backend
        run: |
          api="https://${STAGING_PROJECT_ID}.supabase.co/functions/v1/karvio-api"
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS -X POST "$api" -H 'Content-Type: application/json' -d '{"action":"ping"}' || true)
            if echo "$body" | grep -q "\"buildId\":\"$GITHUB_SHA\""; then
              echo "Staging is running ${GITHUB_REF_NAME} (${GITHUB_SHA::7})."
              echo "Staging API link for the app's setup screen: $api"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Staging did not report the expected build."
          exit 1
