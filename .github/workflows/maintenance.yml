# Temporary: run every test, including the browser suite in Edge, for this branch.
name: Maintenance — full tests

on:
  push:
    branches: [feature/quote-warranty]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Unit and integration tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Install Microsoft Edge for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps msedge
      - name: Browser tests (Edge)
        working-directory: frontend
        run: npm run test:e2e -- --reporter=line
      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
