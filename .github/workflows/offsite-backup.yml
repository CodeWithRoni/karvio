name: Off-site backup
# Every night: download the shop as a .karvio.gz backup (the same file the app's "Download backup"
# makes), lock it in a password-protected 7z archive, prove the archive restores into an empty
# database, then keep it here for 90 days under Actions → this workflow → the run → Artifacts.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  already used by the deploy workflow
#   BACKUP_PASSWORD        any long password (16+ characters); keep a copy somewhere safe.
#                          Without it the backups cannot be opened.
# To restore: download the artifact, open the .7z with 7-Zip using BACKUP_PASSWORD, then in Karvio
# choose Restore backup and pick the .karvio.gz file inside.
on:
  schedule:
    - cron: '17 21 * * *' # 03:17 Asia/Dhaka, after the in-database daily backup at 02:00
  workflow_dispatch:
permissions:
  contents: read
  actions: write # keeps this schedule from being switched off after 60 days without commits
concurrency:
  group: offsite-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: svqhlotlzgmwjneuphpe
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
    steps:
      - name: Require secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN secret is missing."; exit 1; fi
          if [ "${#BACKUP_PASSWORD}" -lt 16 ]; then echo "::error::BACKUP_PASSWORD secret is missing or shorter than 16 characters."; exit 1; fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Download the shop
        id: download
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/plain"; mkdir -p "$work"
          node scripts/offsite-backup.mjs "$work" | tee "$RUNNER_TEMP/backup.log"
          file=$(tail -n 1 "$RUNNER_TEMP/backup.log")
          test -s "$file"
          echo "name=$(basename "$file")" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Encrypt (7z, AES-256, file names hidden)
        id: encrypt
        run: |
          set -euo pipefail
          umask 077
          command -v 7z >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full; }
          stamp=$(TZ=Asia/Dhaka date +%Y-%m-%d-%H%M)
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          archive="$out/Karvio-offsite-backup-$stamp.7z"
          7z a -y -t7z -mx=0 -mhe=on -p"$BACKUP_PASSWORD" "$archive" "${{ steps.download.outputs.file }}" < /dev/null > /dev/null
          rm -f "${{ steps.download.outputs.file }}"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
      - name: Restore test from the encrypted archive
        run: |
          set -euo pipefail
          umask 077
          check="$RUNNER_TEMP/check"; mkdir -p "$check"
          7z x -y -p"$BACKUP_PASSWORD" -o"$check" "${{ steps.encrypt.outputs.archive }}" < /dev/null > /dev/null
          node scripts/offsite-restore-check.mjs "$check/${{ steps.download.outputs.name }}"
          rm -rf "$check"
      - uses: actions/upload-artifact@v4
        with:
          name: karvio-offsite-backup-${{ steps.encrypt.outputs.stamp }}
          path: ${{ steps.encrypt.outputs.archive }}
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/plain" "$RUNNER_TEMP/check" "$RUNNER_TEMP/out"
      - name: Keep the nightly schedule switched on
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/offsite-backup.yml/enable" || echo "::warning::Could not refresh the schedule"
