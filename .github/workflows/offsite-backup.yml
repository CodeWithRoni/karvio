name: Off-site backup
# Every night: download the shop as a .karvio.gz backup (the same file the app's "Download backup"
# makes), prove it restores into an empty database, then keep it here for 90 days under
# Actions → this workflow → the run → Artifacts.
#
# Needs the repository secret SUPABASE_ACCESS_TOKEN (already used by the deploy workflow).
# The file is NOT password-protected (owner's choice). While this repository is public, anyone
# signed in to GitHub can download these backups: all shop records, customer phone numbers and
# user password hashes. Making the repository private limits them to its owner and collaborators.
# To restore: download the artifact, unzip it, then in Karvio choose Restore backup and pick the
# .karvio.gz file inside.
on:
  schedule:
    - cron: '17 21 * * *' # 03:17 Asia/Dhaka, after the in-database daily backup at 02:00
  workflow_dispatch:
permissions:
  contents: read
  actions: write # keeps this schedule from being switched off after 60 days without commits
concurrency:
  group: offsite-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: svqhlotlzgmwjneuphpe
    steps:
      - name: Require secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN secret is missing."; exit 1; fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Download the shop
        id: download
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/plain"; mkdir -p "$work"
          node scripts/offsite-backup.mjs "$work" | tee "$RUNNER_TEMP/backup.log"
          file=$(tail -n 1 "$RUNNER_TEMP/backup.log")
          test -s "$file"
          echo "name=$(basename "$file")" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - name: Restore test
        run: node scripts/offsite-restore-check.mjs "${{ steps.download.outputs.file }}"
      - name: Name the artifact
        id: stamp
        run: echo "stamp=$(TZ=Asia/Dhaka date +%Y-%m-%d-%H%M)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: karvio-offsite-backup-${{ steps.stamp.outputs.stamp }}
          path: ${{ steps.download.outputs.file }}
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/plain"
      - name: Keep the nightly schedule switched on
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/offsite-backup.yml/enable" || echo "::warning::Could not refresh the schedule"
